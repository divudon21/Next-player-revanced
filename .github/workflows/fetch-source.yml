name: Fetch Source Code

on:
  push:
    branches:
      - arena/62d91bc7-next-player-revanced
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/62d91bc7-next-player-revanced

      - name: Check if source already fetched
        id: guard
        run: |
          if ls settings.gradle* 2>/dev/null | grep -q .; then
            echo "Source already present, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download source zip (catbox, gofile fallback)
        if: steps.guard.outputs.skip != 'true'
        run: |
          exec > >(tee fetch-log.txt) 2>&1
          set -x
          cd "$GITHUB_WORKSPACE"
          ok=0
          # Attempt 1: catbox direct link
          curl -fSL --retry 3 --connect-timeout 20 "https://files.catbox.moe/v516w0.zip" -o src.zip && unzip -t src.zip >/dev/null 2>&1 && ok=1
          echo "catbox ok=$ok"
          # Attempt 2: gofile API flow
          if [ "$ok" = 0 ]; then
            TOKEN=$(curl -s -X POST https://api.gofile.io/accounts | jq -r '.data.token')
            echo "gofile token length: ${#TOKEN}"
            DIRECT='https://store-eu-par-6.gofile.io/download/web/e81e2551-f6a9-47fc-a9ae-c3c5fd0ad333/NextPlayer-Complete-Source-All-ABI%20(2).zip'
            curl -sL --retry 3 -H "Cookie: accountToken=$TOKEN" -H "Authorization: Bearer $TOKEN" "$DIRECT" -o src.zip && unzip -t src.zip >/dev/null 2>&1 && ok=1
            echo "gofile direct ok=$ok"
            if [ "$ok" = 0 ]; then
              for ID in Z9bQpXzw zBOKSKid; do
                curl -s -H "Authorization: Bearer $TOKEN" "https://api.gofile.io/contents/$ID" -o meta.json
                head -c 400 meta.json; echo
                LINKS=$(jq -r '.. | objects | .link? // empty' meta.json | sort -u)
                for L in $LINKS; do
                  curl -sL --retry 3 -H "Cookie: accountToken=$TOKEN" "$L" -o src.zip && unzip -t src.zip >/dev/null 2>&1 && ok=1 && break
                done
                [ "$ok" = 1 ] && break
              done
            fi
          fi
          if [ "$ok" != 1 ]; then
            echo "DOWNLOAD FAILED"
            file src.zip 2>/dev/null || true
            head -c 300 src.zip 2>/dev/null || true
            exit 1
          fi
          ls -la src.zip

      - name: Extract source
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/src && mkdir -p /tmp/src
          unzip -o -q src.zip -d /tmp/src
          rm -f src.zip
          # If zip has a single top-level directory, use it as root
          COUNT=$(ls -A /tmp/src | wc -l)
          if [ "$COUNT" = "1" ] && [ -d "/tmp/src/$(ls -A /tmp/src)" ]; then
            SRCROOT="/tmp/src/$(ls -A /tmp/src)"
          else
            SRCROOT="/tmp/src"
          fi
          echo "SRCROOT=$SRCROOT" | tee -a fetch-log.txt
          ls -la "$SRCROOT" | tee -a fetch-log.txt
          rsync -a --exclude='.git' "$SRCROOT"/ "$GITHUB_WORKSPACE"/

      - name: Commit and push source
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add NextPlayer app source code"
          git push origin HEAD:arena/62d91bc7-next-player-revanced
