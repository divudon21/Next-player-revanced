name: Fetch Source Code

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: arena/62d91bc7-next-player-revanced

      - name: Download source zip from Gofile
        run: |
          set -x
          cd "$GITHUB_WORKSPACE"
          DIRECT='https://store-eu-par-6.gofile.io/download/web/e81e2551-f6a9-47fc-a9ae-c3c5fd0ad333/NextPlayer-Complete-Source-All-ABI%20(2).zip'
          TOKEN=$(curl -s -X POST https://api.gofile.io/accounts | jq -r '.data.token')
          echo "token length: ${#TOKEN}"
          ok=0
          # Attempt 1: direct link with account cookie + bearer
          curl -sL --retry 3 -H "Cookie: accountToken=$TOKEN" -H "Authorization: Bearer $TOKEN" "$DIRECT" -o src.zip && unzip -t src.zip >/dev/null 2>&1 && ok=1
          echo "attempt1 ok=$ok"
          # Attempt 2: direct link plain
          if [ "$ok" = 0 ]; then
            curl -sL --retry 3 "$DIRECT" -o src.zip && unzip -t src.zip >/dev/null 2>&1 && ok=1
            echo "attempt2 ok=$ok"
          fi
          # Attempt 3: Gofile API (both known content ids)
          if [ "$ok" = 0 ]; then
            for ID in Z9bQpXzw zBOKSKid; do
              curl -s -H "Authorization: Bearer $TOKEN" "https://api.gofile.io/contents/$ID" -o meta.json
              cat meta.json | head -c 500; echo
              LINKS=$(jq -r '.. | objects | .link? // empty' meta.json | sort -u)
              echo "links: $LINKS"
              for L in $LINKS; do
                curl -sL --retry 3 -H "Cookie: accountToken=$TOKEN" "$L" -o src.zip && unzip -t src.zip >/dev/null 2>&1 && ok=1 && break
              done
              [ "$ok" = 1 ] && break
            done
          fi
          if [ "$ok" != 1 ]; then
            echo "DOWNLOAD FAILED"
            file src.zip 2>/dev/null || true
            head -c 300 src.zip 2>/dev/null || true
            exit 1
          fi
          ls -la src.zip

      - name: Extract source
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/src && mkdir -p /tmp/src
          unzip -o -q src.zip -d /tmp/src
          rm -f src.zip
          # If zip has a single top-level directory, use it as root
          COUNT=$(ls -A /tmp/src | wc -l)
          if [ "$COUNT" = "1" ] && [ -d "/tmp/src/$(ls -A /tmp/src)" ]; then
            SRCROOT="/tmp/src/$(ls -A /tmp/src)"
          else
            SRCROOT="/tmp/src"
          fi
          echo "SRCROOT=$SRCROOT"
          ls -la "$SRCROOT" | head -40
          rsync -a --exclude='.git' "$SRCROOT"/ "$GITHUB_WORKSPACE"/

      - name: Commit and push source
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add NextPlayer app source code (from Gofile zip)"
          git push origin HEAD:arena/62d91bc7-next-player-revanced
